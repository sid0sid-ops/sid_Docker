services:
  bio-linux:
    build: .
    image: sid-bio-linux:latest
    container_name: bio-linux
    platform: linux/amd64
    shm_size: "1gb"
    ports:
      - "127.0.0.1:3000:3000"   # Bio-Linux Desktop (/) & File Upload Channel (/files/)
    environment:
      - TZ=Asia/Kolkata
      - LIBGL_ALWAYS_SOFTWARE=1
      - VMDSIMPLEGRAPHICS=1
      - MAMBA_ROOT_PREFIX=/opt/mamba
    volumes:
      - ./files:/workspace/files                         # Upload / Dropzone folder (Host <-> Linux)
      - ${PROJECTS_DIR:-./projects}:/workspace/projects  # Optional extra host folder (set PROJECTS_DIR in .env)
      - ./workspace:/workspace/scratch                   # Scratch testing directory
      - ./config:/config                                 # Persistent user home & XFCE preferences
      - ./envs:/opt/mamba/envs                           # Persistent isolated micromamba tool environments
    restart: "no"
