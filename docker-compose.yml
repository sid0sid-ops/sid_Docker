services:
  adt:
    build: .
    container_name: adt-kasm-mac
    platform: linux/amd64
    shm_size: "1gb"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - TITLE=Bioinformatics Desktop
      - LIBGL_ALWAYS_SOFTWARE=1
      - VMDSIMPLEGRAPHICS=1
      - START_DOCKER=false
    volumes:
      - ..:/workspace
      - ./config:/config
    restart: "no"
